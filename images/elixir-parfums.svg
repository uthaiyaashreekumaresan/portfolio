<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1430" />
      <stop offset="50%" stop-color="#30234A" />
      <stop offset="100%" stop-color="#140C22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bottleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="60%" stop-color="#7952B3" />
      <stop offset="100%" stop-color="#4C327A" />
    </linearGradient>
    <linearGradient id="bottleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBCFE8" />
      <stop offset="60%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="bottleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="180" fill="#7952B3" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="400" r="220" fill="#C4B5FD" opacity="0.18" filter="url(#glow)" />

  <!-- Website Browser Window Chrome -->
  <rect x="50" y="40" width="1100" height="600" rx="16" fill="#FAF8FF" stroke="#4C327A" stroke-width="2" />
  
  <!-- Browser Header Bar -->
  <rect x="50" y="40" width="1100" height="44" rx="16" fill="#241B35" />
  <rect x="50" y="70" width="1100" height="14" fill="#241B35" />
  <circle cx="75" cy="62" r="6" fill="#EF4444" />
  <circle cx="95" cy="62" r="6" fill="#F59E0B" />
  <circle cx="115" cy="62" r="6" fill="#10B981" />
  <rect x="360" y="50" width="480" height="24" rx="6" fill="#382A52" />
  <text x="600" y="66" fill="#E8DFF5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">https://elixir-parfums.com/collections</text>

  <!-- E-commerce Navbar -->
  <rect x="50" y="84" width="1100" height="64" fill="#FFFFFF" stroke="#E8DFF5" stroke-width="1" />
  <text x="90" y="124" fill="#30234A" font-family="'Playfair Display', serif, 'Plus Jakarta Sans'" font-size="22" font-weight="bold" letter-spacing="1">ÉLIXIR PARFUMS</text>
  <text x="270" y="122" fill="#7952B3" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">All Fragrances</text>
  <text x="390" y="122" fill="#625B71" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">For Her</text>
  <text x="470" y="122" fill="#625B71" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">For Him</text>
  <text x="550" y="122" fill="#625B71" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Unisex</text>
  <text x="630" y="122" fill="#625B71" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Gift Sets</text>
  <text x="720" y="122" fill="#D97706" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">✦ Admin Portal</text>
  
  <!-- Navbar Right Actions -->
  <rect x="940" y="100" width="80" height="32" rx="16" fill="#F0EAFE" />
  <text x="980" y="121" fill="#7952B3" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Cart (3)</text>
  <rect x="1035" y="100" width="80" height="32" rx="16" fill="#7952B3" />
  <text x="1075" y="121" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Account</text>

  <!-- Hero Banner Strip -->
  <rect x="80" y="165" width="1040" height="150" rx="12" fill="url(#bgGrad)" />
  <text x="120" y="215" fill="url(#goldGrad)" font-family="'Playfair Display', serif" font-size="28" font-weight="bold">L'Art de la Haute Parfumerie</text>
  <text x="120" y="245" fill="#E8DFF5" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" max-width="500">Discover handcrafted artisanal fragrances curated with rare botanicals &amp; essences.</text>
  <rect x="120" y="265" width="140" height="34" rx="6" fill="#7952B3" />
  <text x="190" y="287" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Explore Catalog →</text>
  
  <!-- Banner Mini Badges -->
  <rect x="880" y="185" width="210" height="32" rx="6" fill="#4C327A" opacity="0.8" />
  <text x="985" y="206" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ Full Stack MERN Architecture</text>
  <rect x="880" y="225" width="210" height="32" rx="6" fill="#4C327A" opacity="0.8" />
  <text x="985" y="246" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ Cart &amp; Order Management</text>
  <rect x="880" y="265" width="210" height="32" rx="6" fill="#4C327A" opacity="0.8" />
  <text x="985" y="286" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ Admin Dashboard &amp; Auth</text>

  <!-- Product Showcase Grid (3 Cards) -->
  <!-- Product 1 -->
  <g transform="translate(80, 335)">
    <rect width="325" height="280" rx="12" fill="#FFFFFF" stroke="#E8DFF5" stroke-width="1.5" />
    <rect x="15" y="15" width="295" height="150" rx="8" fill="#F0EAFE" />
    <!-- Perfume Bottle 1 -->
    <rect x="145" y="40" width="35" height="20" rx="3" fill="#D4AF37" />
    <rect x="152" y="32" width="21" height="8" rx="2" fill="#F59E0B" />
    <rect x="132" y="60" width="61" height="85" rx="10" fill="url(#bottleGrad1)" />
    <rect x="140" y="80" width="45" height="40" rx="4" fill="#FFFFFF" opacity="0.9" />
    <text x="162" y="98" fill="#30234A" font-family="serif" font-size="8" font-weight="bold" text-anchor="middle">ÉLIXIR</text>
    <text x="162" y="108" fill="#7952B3" font-family="sans-serif" font-size="6" text-anchor="middle">VELVET NOIR</text>
    
    <text x="20" y="190" fill="#30234A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">Velvet Noir Eau De Parfum</text>
    <text x="20" y="210" fill="#625B71" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Woody Floral • Black Amber &amp; Vanilla</text>
    <text x="20" y="240" fill="#7952B3" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="extrabold">$145.00</text>
    <rect x="205" y="222" width="105" height="32" rx="6" fill="#7952B3" />
    <text x="257" y="243" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ Add to Cart</text>
  </g>

  <!-- Product 2 -->
  <g transform="translate(438, 335)">
    <rect width="325" height="280" rx="12" fill="#FFFFFF" stroke="#E8DFF5" stroke-width="1.5" />
    <rect x="15" y="15" width="295" height="150" rx="8" fill="#FDF2F8" />
    <!-- Perfume Bottle 2 -->
    <rect x="145" y="40" width="35" height="20" rx="3" fill="#D4AF37" />
    <rect x="152" y="32" width="21" height="8" rx="2" fill="#F59E0B" />
    <rect x="132" y="60" width="61" height="85" rx="10" fill="url(#bottleGrad2)" />
    <rect x="140" y="80" width="45" height="40" rx="4" fill="#FFFFFF" opacity="0.9" />
    <text x="162" y="98" fill="#831843" font-family="serif" font-size="8" font-weight="bold" text-anchor="middle">ÉLIXIR</text>
    <text x="162" y="108" fill="#DB2777" font-family="sans-serif" font-size="6" text-anchor="middle">ROSE IMPÉRIALE</text>
    
    <text x="20" y="190" fill="#30234A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">Rose Impériale Parfum</text>
    <text x="20" y="210" fill="#625B71" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Grasse Rose • Damask &amp; White Musk</text>
    <text x="20" y="240" fill="#7952B3" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="extrabold">$160.00</text>
    <rect x="205" y="222" width="105" height="32" rx="6" fill="#7952B3" />
    <text x="257" y="243" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ Add to Cart</text>
  </g>

  <!-- Product 3 -->
  <g transform="translate(795, 335)">
    <rect width="325" height="280" rx="12" fill="#FFFFFF" stroke="#E8DFF5" stroke-width="1.5" />
    <rect x="15" y="15" width="295" height="150" rx="8" fill="#F0F9FF" />
    <!-- Perfume Bottle 3 -->
    <rect x="145" y="40" width="35" height="20" rx="3" fill="#D4AF37" />
    <rect x="152" y="32" width="21" height="8" rx="2" fill="#F59E0B" />
    <rect x="132" y="60" width="61" height="85" rx="10" fill="url(#bottleGrad3)" />
    <rect x="140" y="80" width="45" height="40" rx="4" fill="#FFFFFF" opacity="0.9" />
    <text x="162" y="98" fill="#0C4A6E" font-family="serif" font-size="8" font-weight="bold" text-anchor="middle">ÉLIXIR</text>
    <text x="162" y="108" fill="#0284C7" font-family="sans-serif" font-size="6" text-anchor="middle">OCEAN CÉLESTE</text>
    
    <text x="20" y="190" fill="#30234A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">Océan Céleste Fresh EDP</text>
    <text x="20" y="210" fill="#625B71" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Marine Bergamot • Cedar &amp; Sage</text>
    <text x="20" y="240" fill="#7952B3" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="extrabold">$138.00</text>
    <rect x="205" y="222" width="105" height="32" rx="6" fill="#7952B3" />
    <text x="257" y="243" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ Add to Cart</text>
  </g>
</svg>
